name: Сообщить об ошибке
description: Помогите разобраться с проблемой в Dota Accepter.
title: "[Ошибка] "
body:
  - type: markdown
    attributes:
      value: |
        Опишите одну проблему в одном обращении. Перед отправкой проверьте, нет ли уже похожей темы.
        **Скройте токены Telegram и Яндекса, пароли и личные данные. Не прикладывайте config.json.**
  - type: textarea
    id: problem
    attributes:
      label: Что произошло?
      description: Что вы ожидали и что произошло на самом деле?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как повторить ошибку?
      placeholder: |
        1. Открываю программу...
        2. Включаю...
        3. Получаю...
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Версия Windows
      placeholder: Например, Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: launch
    attributes:
      label: Как запускаете программу?
      options:
        - Готовый EXE
        - Через Python из исходников
        - Через ярлык, способ неизвестен
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Какая версия программы?
      description: Укажите версию, ссылку на скачанную сборку, дату скачивания или коммит. Если неизвестно, так и напишите.
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: Как часто возникает ошибка?
      options:
        - Каждый раз
        - Иногда
        - Возникла один раз
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Дополнительные сведения
      description: |
        Для распознавания укажите разрешение, масштаб Windows, язык и режим окна игры.
        Для Telegram или Алисы укажите, проходит ли проверка в настройках и включён ли переключатель на главной.
        Для горячей клавиши укажите назначенное сочетание и где оно не срабатывает.
  - type: textarea
    id: evidence
    attributes:
      label: Журнал и скриншоты
      description: Приложите относящийся к ошибке фрагмент журнала или скриншот. Сначала скройте секреты и личные данные.
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка перед публикацией
      options:
        - label: Я проверил текст и вложения и убрал токены, пароли и личные данные.
          required: true
