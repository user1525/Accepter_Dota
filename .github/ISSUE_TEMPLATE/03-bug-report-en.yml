name: "[EN] Report a bug"
description: Help us investigate a problem with Dota Accepter.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Report one problem per issue. Check for existing reports before submitting.
        **Remove Telegram and Yandex tokens, passwords, and personal information. Do not attach config.json.**
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe what you expected and what actually happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the application...
        2. Enable...
        3. Observe...
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: For example, Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: launch
    attributes:
      label: How do you launch the application?
      options:
        - Packaged EXE
        - From source using Python
        - Through a shortcut, launch method unknown
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Application version
      description: Provide the version, download link, download date, or commit. If unknown, say so.
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often does this happen?
      options:
        - Every time
        - Sometimes
        - Happened once
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Additional details
      description: |
        For detection problems, include your resolution, Windows scaling, game language, and window mode.
        For Telegram or Alice, say whether the test in settings succeeds and the switch on the main screen is enabled.
        For hotkey problems, include the assigned shortcut and where it fails to work.
  - type: textarea
    id: evidence
    attributes:
      label: Logs and screenshots
      description: Attach relevant log excerpts or screenshots. Remove secrets and personal information first.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I have reviewed the text and attachments and removed tokens, passwords, and personal information.
          required: true
